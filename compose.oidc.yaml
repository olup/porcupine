# Unreleased: add to compose.yaml and compose.oauth.yaml for invited-user OIDC.
# Add compose.email.yaml as well to keep SMTP OTP available alongside the IdP.
services:
  porcupine:
    environment:
      PORCUPINE_OIDC_ISSUER: ${PORCUPINE_OIDC_ISSUER:-https://accounts.google.com}
      PORCUPINE_OIDC_CLIENT_ID: ${PORCUPINE_OIDC_CLIENT_ID:?Set the upstream OIDC client ID}
      PORCUPINE_OIDC_CLIENT_SECRET_FILE: /run/secrets/porcupine_oidc_client_secret
      PORCUPINE_ADMIN_EMAIL: ${PORCUPINE_ADMIN_EMAIL:-}
    secrets:
      - porcupine_oidc_client_secret
secrets:
  porcupine_oidc_client_secret:
    file: ${PORCUPINE_OIDC_CLIENT_SECRET_FILE:?Set the host path of the OIDC client secret file}
