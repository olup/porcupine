site_name: Porcupine
site_url: https://olup.github.io/porcupine/docs/
docs_dir: docs
site_dir: bin/docs-web/porcupine/docs
use_directory_urls: true
theme:
  name: null
  custom_dir: docs-theme
plugins: []
hooks:
  - docs-theme/hooks.py
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: "#"
not_in_nav: |
  /*.md
  /reference/**
  /design/**
validation:
  links:
    anchors: warn
nav:
  - Get started:
      - Overview: README.md
      - Quickstart: quickstart.md
      - Connect your tools: connect-tools.md
      - CLI: cli.md
  - Use your data:
      - Collect events: collect-events.md
      - Users and sessions: data-and-identity.md
      - Import history: imports.md
      - Query events: query-events.md
      - Correct or delete events: events.md
      - Export results: exports.md
      - Deliver to other systems: pipelines.md
  - Run an instance:
      - Hosting: hosting.md
      - People and permissions: access.md
      - Storage: storage.md
      - Back up and restore: backup-and-restore.md
      - Architecture: architecture.md
  - Reference:
      - HTTP API: reference/management-api.md
      - SQL and discovery: reference/analytics.md
      - DuckDB recipes: reference/duckdb-recipes.md
      - MCP: reference/mcp.md
      - Native event schema: reference/native-event-contract.md
      - All reference pages: reference/README.md
  - Project:
      - Roadmap: roadmap.md
      - Design and validation records: design/README.md
