# Fresh DuckLake analytical S3 storage. Local SQLite/catalogs still use /data.
services:
  porcupine:
    environment:
      PORCUPINE_DUCKLAKE_S3_BUCKET: ${PORCUPINE_DUCKLAKE_S3_BUCKET:?Set the analytical bucket}
      PORCUPINE_DUCKLAKE_S3_PREFIX: ${PORCUPINE_DUCKLAKE_S3_PREFIX:-porcupine}
      PORCUPINE_DUCKLAKE_S3_REGION: ${PORCUPINE_DUCKLAKE_S3_REGION:?Set the bucket region}
      PORCUPINE_DUCKLAKE_S3_ENDPOINT: ${PORCUPINE_DUCKLAKE_S3_ENDPOINT:-}
      PORCUPINE_DUCKLAKE_S3_PATH_STYLE: ${PORCUPINE_DUCKLAKE_S3_PATH_STYLE:-false}
      PORCUPINE_DUCKLAKE_S3_REQUEST_TIMEOUT_SECONDS: ${PORCUPINE_DUCKLAKE_S3_REQUEST_TIMEOUT_SECONDS:-5}
      PORCUPINE_DUCKLAKE_S3_CA_CERT_FILE: ${PORCUPINE_DUCKLAKE_S3_CA_CERT_FILE:-}
      PORCUPINE_DUCKLAKE_S3_ACCESS_KEY_ID: ${PORCUPINE_DUCKLAKE_S3_ACCESS_KEY_ID:-}
      PORCUPINE_DUCKLAKE_S3_SECRET_ACCESS_KEY: ${PORCUPINE_DUCKLAKE_S3_SECRET_ACCESS_KEY:-}
      PORCUPINE_DUCKLAKE_S3_SESSION_TOKEN: ${PORCUPINE_DUCKLAKE_S3_SESSION_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_WEB_IDENTITY_TOKEN_FILE: ${AWS_WEB_IDENTITY_TOKEN_FILE:-}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
      AWS_ROLE_SESSION_NAME: ${AWS_ROLE_SESSION_NAME:-}
      AWS_CONTAINER_CREDENTIALS_FULL_URI: ${AWS_CONTAINER_CREDENTIALS_FULL_URI:-}
      AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: ${AWS_CONTAINER_CREDENTIALS_RELATIVE_URI:-}
      AWS_CONTAINER_AUTHORIZATION_TOKEN: ${AWS_CONTAINER_AUTHORIZATION_TOKEN:-}
