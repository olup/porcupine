# Development backup destination. Use one native backup overlay per deployment.
services:
  porcupine:
    environment:
      PORCUPINE_BACKUP_S3_BUCKET: ${PORCUPINE_BACKUP_S3_BUCKET:?Set an independent backup bucket}
      PORCUPINE_BACKUP_S3_PREFIX: ${PORCUPINE_BACKUP_S3_PREFIX:?Set a private backup prefix}
      PORCUPINE_BACKUP_S3_REGION: ${PORCUPINE_BACKUP_S3_REGION:?Set the backup region}
      PORCUPINE_BACKUP_S3_ENDPOINT: ${PORCUPINE_BACKUP_S3_ENDPOINT:-}
      PORCUPINE_BACKUP_S3_PATH_STYLE: ${PORCUPINE_BACKUP_S3_PATH_STYLE:-false}
      PORCUPINE_BACKUP_S3_CA_CERT_FILE: ${PORCUPINE_BACKUP_S3_CA_CERT_FILE:-}
      PORCUPINE_BACKUP_S3_ACCESS_KEY_ID: ${PORCUPINE_BACKUP_S3_ACCESS_KEY_ID:-}
      PORCUPINE_BACKUP_S3_SECRET_ACCESS_KEY: ${PORCUPINE_BACKUP_S3_SECRET_ACCESS_KEY:-}
      PORCUPINE_BACKUP_S3_SESSION_TOKEN: ${PORCUPINE_BACKUP_S3_SESSION_TOKEN:-}
      PORCUPINE_BACKUP_INTERVAL: ${PORCUPINE_BACKUP_INTERVAL:-24h}
      PORCUPINE_BACKUP_TIMEOUT: ${PORCUPINE_BACKUP_TIMEOUT:-5m}
      PORCUPINE_BACKUP_RETAIN: ${PORCUPINE_BACKUP_RETAIN:-7}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_WEB_IDENTITY_TOKEN_FILE: ${AWS_WEB_IDENTITY_TOKEN_FILE:-}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
      AWS_ROLE_SESSION_NAME: ${AWS_ROLE_SESSION_NAME:-}
      AWS_CONTAINER_CREDENTIALS_FULL_URI: ${AWS_CONTAINER_CREDENTIALS_FULL_URI:-}
      AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: ${AWS_CONTAINER_CREDENTIALS_RELATIVE_URI:-}
      AWS_CONTAINER_AUTHORIZATION_TOKEN: ${AWS_CONTAINER_AUTHORIZATION_TOKEN:-}
