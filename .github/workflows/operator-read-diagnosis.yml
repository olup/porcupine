name: Operator read diagnosis
on:
  push:
    branches: [ci/operator-read-diagnosis]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - run: make shared-integration
        env:
          PORCUPINE_TEST_POSTGRES_CACHE: ${{ runner.temp }}/porcupine-test-postgres
