name: Compare hosted reservation reuse
on:
  push:
    branches: [codex/c3-flush-compare]
permissions:
  contents: read
jobs:
  measure:
    name: Flush cost (${{ matrix.revision }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: before
            ref: 9b6afff
          - revision: after
            ref: f76bbe4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check out target and apply the same C0 test
        env:
          REFERENCE: ${{ matrix.ref }}
        run: |
          cp internal/porcupine/hosted_flush_cost_test.go "$RUNNER_TEMP/"
          git checkout --detach "$REFERENCE"
          cp "$RUNNER_TEMP/hosted_flush_cost_test.go" internal/porcupine/
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Measure the hosted flush
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go run ./internal/cmd/shared-postgres-integration -- \
            go run ./internal/cmd/ducklake-s3-integration -suite shared -race=false -timeout=15m \
            -run '^TestDuckLakeS3SharedPostgresHostedFlushCost$' | tee "$RUNNER_TEMP/hosted-flush.log"
          grep -q 'hosted-flush-cost {' "$RUNNER_TEMP/hosted-flush.log"
        env:
          PORCUPINE_MEASURE_HOSTED_FLUSH: "1"
