name: Compare hosted reservation reuse
on:
  push:
    branches: [codex/c3-flush-compare]
permissions:
  contents: read
jobs:
  measure:
    name: Alternate revisions on one runner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Measure both versions twice
        run: |
          set -euo pipefail
          test_file=internal/porcupine/hosted_flush_cost_test.go
          cp "$test_file" "$RUNNER_TEMP/"
          for ref in 9b6afff f76bbe4 f76bbe4 9b6afff; do
            echo "Measuring $ref"
            git checkout --detach "$ref"
            cp "$RUNNER_TEMP/hosted_flush_cost_test.go" "$test_file"
            CGO_ENABLED=0 go run ./internal/cmd/shared-postgres-integration -- \
              go run ./internal/cmd/ducklake-s3-integration -suite shared -race=false -timeout=15m \
              -run '^TestDuckLakeS3SharedPostgresHostedFlushCost$' | tee "$RUNNER_TEMP/hosted-flush.log"
            grep -q 'hosted-flush-cost {' "$RUNNER_TEMP/hosted-flush.log"
          done
        env:
          PORCUPINE_MEASURE_HOSTED_FLUSH: "1"
          PORCUPINE_MEASURE_HOSTED_FLUSH_HISTORY: "0"
