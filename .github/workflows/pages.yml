name: Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'VERSION'
      - 'docs/**'
      - 'docs-theme/**'
      - 'internal/docsite/**'
      - 'internal/cmd/docsite/**'
      - 'internal/porcupine/contracts/*.schema.json'
      - 'examples/events/**'
      - 'go.mod'
      - 'Makefile'
      - 'README.md'
      - 'cli/README.md'
      - 'examples/hello.sh'
      - 'compose*.yaml'
      - 'compat/matrix.json'
      - 'compat/profiles.mjs'
      - 'deployment/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  released-version:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Publish only an existing stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: CGO_ENABLED=0 go run ./internal/cmd/docsite published-release
  build:
    needs: released-version
    if: needs.released-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=0 go test ./internal/docsite ./internal/cmd/docsite
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.cache/porcupine/hugo
          key: docs-hugo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/docsite/hugo.go') }}
      - run: make docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: bin/docs-web/porcupine/
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish site
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
