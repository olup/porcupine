name: Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'VERSION'
      - 'docs/**'
      - 'docs-theme/**'
      - 'docs-requirements.txt'
      - 'mkdocs.yml'
      - 'README.md'
      - 'cli/README.md'
      - 'scripts/build_docs.py'
      - 'scripts/release_version.py'
      - 'scripts/test_release_version.py'
      - 'examples/hello.sh'
      - 'compose*.yaml'
      - 'compat/matrix.json'
      - 'compat/profiles.mjs'
      - 'deployment/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  released-version:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Publish only an existing stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request
          from pathlib import Path
          tag = 'v' + Path('VERSION').read_text().strip()
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Invalid VERSION')
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tags/' + tag
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
              published = not release['draft'] and not release['prerelease']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit('Cannot check release publication: HTTP ' + str(error.code))
              published = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('published=' + str(published).lower() + '\n')
          if not published:
              print(tag + ' is not published; keeping the existing website until release publication.')
          PY
  build:
    needs: released-version
    if: needs.released-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: python -m pip install -r docs-requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_release_version.py'
      - run: python scripts/build_docs.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: bin/docs-web/porcupine/
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish site
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
