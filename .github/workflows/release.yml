name: Release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and test Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image and test it on its target architecture
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          # A tagged checkout must select its corresponding prebuilt image.
          PORCUPINE_BOOTSTRAP_TOKEN=check \
            docker compose -f compose.yaml -f compose.release.yaml config --images | grep -Fx "$image"
          docker build --platform "linux/$ARCH" --build-arg VERSION="$version" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.licenses=MIT -t "$image" .
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$ARCH"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "65532:65532"
          test "$(docker run --rm "$image" --version)" = "$version"
          export PORCUPINE_BOOTSTRAP_TOKEN="$(openssl rand -hex 32)"
          network="porcupine-release-$ARCH-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          server="porcupine-release-server-$ARCH-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl_image="curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6"
          docker pull "$curl_image"
          docker network create --internal "$network" >/dev/null
          cid=""
          cleanup() {
            if [ -n "$cid" ]; then docker rm -f "$cid" >/dev/null; fi
            docker network rm "$network" >/dev/null
          }
          trap cleanup EXIT
          # No outbound internet: the nonroot image must load its bundled extension.
          cid="$(docker run -d --name "$server" --network "$network" --memory=2g --cpus=2 \
            -e PORCUPINE_BOOTSTRAP_TOKEN "$image")"
          curl() { docker run --rm --network "$network" "$curl_image" "$@"; }
          origin="http://$server:8080"
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 "$origin/readyz" |
            jq -e '.status == "ready"'
          created="$(curl --fail --silent --show-error "$origin/api/v1/projects" \
            -H "Authorization: Bearer $PORCUPINE_BOOTSTRAP_TOKEN" -H 'Content-Type: application/json' \
            --data '{"name":"release artifact smoke"}')"
          project="$(printf '%s' "$created" | jq -er '.project.id')"
          ingest="$(printf '%s' "$created" | jq -er '.ingest_token')"
          payload='{"type":"track","message_id":"release-smoke-stable","actor_id":"synthetic-visitor","name":"release-smoke","timestamp":"2026-11-01T12:00:00Z","properties":{"amount":42}}'
          first="$(curl --fail --silent --show-error "$origin/ingest/v1/events" \
            -H "X-Porcupine-Key: $ingest" -H 'Content-Type: application/json' --data "$payload")"
          event_id="$(printf '%s' "$first" | jq -er '.receipts[0].event_id | select(type == "string" and length > 0)')"
          query='{"sql":"SELECT event_id,event FROM events WHERE event=$name","parameters":{"name":"release-smoke"},"use_cache":false}'
          visible=false
          for attempt in $(seq 1 120); do
            if result="$(curl --fail --silent --show-error "$origin/api/v1/projects/$project/query" \
              -H "Authorization: Bearer $PORCUPINE_BOOTSTRAP_TOKEN" -H 'Content-Type: application/json' --data "$query")"; then
              if printf '%s' "$result" | jq -e --arg id "$event_id" \
                '.result.rows == 1 and (.result.data | length) == 1 and .result.data[0].event_id == $id and .result.data[0].event == "release-smoke"' >/dev/null; then
                visible=true
                break
              fi
            fi
            sleep 0.5
          done
          test "$visible" = true
          retry="$(curl --fail --silent --show-error "$origin/ingest/v1/events" \
            -H "X-Porcupine-Key: $ingest" -H 'Content-Type: application/json' --data "$payload")"
          printf '%s' "$retry" | jq -e --arg id "$event_id" \
            '.duplicates == 1 and .receipts[0].event_id == $id' >/dev/null
          curl --fail --silent --show-error "$origin/api/v1/projects/$project/schema" \
            -H "Authorization: Bearer $PORCUPINE_BOOTSTRAP_TOKEN" |
            jq -e '.enabled == true and .sql.dialect == "duckdb"' >/dev/null
          mkdir dist
          docker save "$image" | gzip -1 > "dist/porcupine-$version-linux-$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          compression-level: 0
          if-no-files-found: error

  cli:
    uses: ./.github/workflows/cli.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: [image, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Publish the tested images and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This release already exists." >&2
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          for arch in amd64 arm64; do
            docker load -i "porcupine-$version-linux-$arch.tar.gz"
            test "$(docker image inspect --format '{{.Architecture}}' "$repo:$version")" = "$arch"
            docker tag "$repo:$version" "$repo:$version-$arch"
            docker push "$repo:$version-$arch"
            docker image rm "$repo:$version" >/dev/null
          done
          docker buildx imagetools create -t "$repo:$version" "$repo:$version-amd64" "$repo:$version-arm64"
          docker buildx imagetools inspect "$repo:$version" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Porcupine $GITHUB_REF_NAME" --generate-notes \
            --notes "Headless product analytics with embedded DuckDB/DuckLake, durable ingestion, project-scoped SQL, identity resolution and editable events.

          Pull \`$repo:$version\` or verify the archive for your architecture against \`SHA256SUMS\` and import it with \`docker load\`. Both contain the same tested image.

          Download the standalone CLI for macOS, Linux or Windows from the \`porcupine-cli-\` assets. Verify the archive against \`SHA256SUMS\` and extract it.

          [Agent guide](https://olup.github.io/porcupine/llms.txt) · [Hosting instructions]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/hosting.md)" \
            SHA256SUMS *.tar.gz *.zip
