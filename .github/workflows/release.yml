name: Release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and test Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image and test it on its target architecture
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          # A tagged checkout must select its corresponding prebuilt image.
          PORCUPINE_BOOTSTRAP_TOKEN=check PORCUPINE_CLICKHOUSE_PASSWORD=check \
            docker compose -f compose.yaml -f compose.release.yaml config --images | grep -Fx "$image"
          docker build --platform "linux/$ARCH" --build-arg VERSION="$version" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.licenses=MIT -t "$image" .
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$ARCH"
          test "$(docker run --rm "$image" --version)" = "$version"
          export PORCUPINE_BOOTSTRAP_TOKEN="$(openssl rand -hex 32)"
          cid="$(docker run -d -p 127.0.0.1::8080 -e PORCUPINE_BOOTSTRAP_TOKEN "$image")"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          address="$(docker port "$cid" 8080/tcp)"
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 "http://$address/readyz" |
            jq -e '.status == "ready"'
          mkdir dist
          docker save "$image" | gzip -1 > "dist/porcupine-$version-linux-$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          compression-level: 0
          if-no-files-found: error

  cli:
    uses: ./.github/workflows/cli.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: [image, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Publish the tested images and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This release already exists." >&2
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          for arch in amd64 arm64; do
            docker load -i "porcupine-$version-linux-$arch.tar.gz"
            test "$(docker image inspect --format '{{.Architecture}}' "$repo:$version")" = "$arch"
            docker tag "$repo:$version" "$repo:$version-$arch"
            docker push "$repo:$version-$arch"
            docker image rm "$repo:$version" >/dev/null
          done
          docker buildx imagetools create -t "$repo:$version" "$repo:$version-amd64" "$repo:$version-arm64"
          docker buildx imagetools inspect "$repo:$version" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Porcupine $GITHUB_REF_NAME" --generate-notes \
            --notes "Self-hosted analytics for agents with PostHog-compatible capture, project-scoped SQL, webhooks and scheduled S3 delivery.

          Pull \`$repo:$version\` or verify the archive for your architecture against \`SHA256SUMS\` and import it with \`docker load\`. Both contain the same tested image.

          Download the standalone CLI for macOS, Linux or Windows from the \`porcupine-cli-\` assets. Verify the archive against \`SHA256SUMS\` and extract it.

          [Agent guide](https://olup.github.io/porcupine/llms.txt) · [Hosting instructions]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/hosting.md)" \
            SHA256SUMS *.tar.gz *.zip
