name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GOFLAGS: -trimpath
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile
            internal/docsite/hugo.go
      - run: CGO_ENABLED=0 go test ./internal/docsite ./internal/cmd/docsite
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.cache/porcupine/hugo
          key: docs-hugo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/docsite/hugo.go') }}
      - run: make docs
  cli:
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/cli.yml
    with:
      version: dev
  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile
            internal/cmd/genapi/main.go
      - name: Test independent modules without the native engine
        run: make test-core
      - run: make lint
      - name: Race-test every other package
        shell: bash
        run: |
          set -euo pipefail
          packages="$(go list ./... | grep -v '^github.com/olup/porcupine/internal/porcupine$')"
          go test -race $packages -count=1 -timeout=600s
      - run: make build
      - run: CGO_ENABLED=0 go run ./internal/cmd/standalone-cli-check --server bin/porcupine
  backend:
    name: Backend race ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile
            internal/cmd/test-shard/main.go
      - run: mkdir -p bin/test-results
      - name: Run the discovered backend race shard
        run: CGO_ENABLED=0 go run ./internal/cmd/test-shard -index ${{ matrix.shard }} -count 2 -report bin/test-results/shard-${{ matrix.shard }}.json -log bin/test-results/shard-${{ matrix.shard }}.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-race-${{ matrix.shard }}
          path: bin/test-results/
          if-no-files-found: error
  go:
    # Preserve the existing gate, including every shard and artifact journey.
    needs: [go-checks, backend, documentation, cli, native-integration, restore-integration, shared-integration, sdk-compat, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'to_entries | all(.[];
            .value.result == "success" or
            (.key == "cli" and env.GITHUB_REF_TYPE == "tag" and .value.result == "skipped") or
            (.key == "security" and env.GITHUB_EVENT_NAME == "pull_request" and .value.result == "skipped")
          )' <<< "$JOB_RESULTS"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile
            internal/cmd/test-shard/main.go
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-race-*
          merge-multiple: true
          path: bin/test-results
      - name: Require complete, non-overlapping backend test execution
        run: CGO_ENABLED=0 go run ./internal/cmd/test-shard verify bin/test-results/shard-*.json
  security:
    # Vulnerability scan and fuzzing run on main, releases and nightly, not on every PR push.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile
            internal/nativequery/policy.go
      - run: make security-check
  native-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile
            internal/cmd/ducklake-s3-integration/main.go
      - run: make ducklake-smoke ducklake-s3-test
  restore-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile
            Dockerfile
      - run: make ducklake-restore-drill
  shared-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        env:
          GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
        run: |
          modules=$(go env GOMODCACHE)
          build=$(go env GOCACHE)
          {
            echo "prefix=shared-go-${RUNNER_ARCH}-${ImageOS}-${GO_VERSION}-"
            echo "modules=${modules}"
            echo "build=${build}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ steps.go-cache.outputs.prefix }}${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'internal/cmd/shared-postgres-integration/main.go') }}
          # Go recompiles changed inputs and reuses compatible compiled packages.
          restore-keys: ${{ steps.go-cache.outputs.prefix }}
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ${{ runner.temp }}/porcupine-test-postgres
          key: native-postgres-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'internal/cmd/shared-postgres-integration/main.go') }}
      - run: make shared-integration
        env:
          PORCUPINE_TEST_POSTGRES_CACHE: ${{ runner.temp }}/porcupine-test-postgres
  sdk-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile
            compat/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            compat/package-lock.json
            sdk/browser/package-lock.json
      - run: make compat-install
      - run: npm --prefix sdk/browser test
      - name: Race-test the Chromium sign-in journeys
        run: go test -race -v ./internal/porcupine -run '^(TestInteractiveOIDCRealBrowser|TestEmailLoginChromium)$' -count=1
        env:
          PORCUPINE_OIDC_BROWSER: "1"
      - run: npm --prefix compat test
      - run: npm ci --prefix compat/segment
      - run: npm test --prefix compat/segment
      - run: npm --prefix compat run test:identify
      - name: Package the tested browser SDK
        working-directory: sdk/browser
        run: |
          set -euo pipefail
          version="$(cat ../../VERSION)"
          out="$RUNNER_TEMP/browser-sdk"
          mkdir -p "$out"
          npm pack ./dist --ignore-scripts --pack-destination "$out"
          test -s "$out/porcupine-browser-$version.tgz"
          script="$out/porcupine-browser-$version.js"
          cp dist/porcupine.js "$script"
          printf 'sha384-%s\n' "$(openssl dgst -sha384 -binary "$script" | openssl base64 -A)" > "$script.sri"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-sdk
          path: ${{ runner.temp }}/browser-sdk/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sdk-compat
          path: compat/artifacts/
          if-no-files-found: error
