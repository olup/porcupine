name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cli:
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/cli.yml
    with:
      version: dev
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: python3 scripts/standalone_cli_check.py
      - run: make build
      - run: go test -race ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: make security-check
  clickhouse-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make integration
      - run: make integration-s3
      - run: make restore-drill
      - run: make online-restore-drill
  ducklake-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make ducklake-test
      - run: make ducklake-smoke
      - run: make ducklake-compare
  sdk-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: compat/package-lock.json
      - run: npm ci --prefix compat
      - run: cd compat && npx playwright install --with-deps chromium
      - run: PORCUPINE_OIDC_BROWSER=1 go test -race ./internal/porcupine -run "^(TestInteractiveOIDC|TestEmail)" -count=1
      - run: make compat
      - run: npm ci --prefix compat/segment
      - run: npm test --prefix compat/segment
      - run: npm --prefix compat run test:identify-clickhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sdk-compat
          path: compat/artifacts/
          if-no-files-found: error
