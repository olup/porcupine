name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs-requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_release_version.py'
      - run: python scripts/build_docs.py
  cli:
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/cli.yml
    with:
      version: dev
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test independent modules without the native engine
        run: make test-core
      - run: make check-full
      - run: make build
      - run: python3 scripts/standalone_cli_check.py --server bin/porcupine
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  security:
    # Vulnerability scan and fuzzing run on main, releases and nightly, not on every PR push.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make security-check
  native-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # One make graph builds the standalone CLI once for both journeys.
      - run: make ducklake-smoke ducklake-s3-test ducklake-restore-drill
  shared-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ${{ runner.temp }}/porcupine-test-postgres
          key: native-postgres-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'internal/cmd/shared-postgres-integration/main.go') }}
      - run: make shared-integration
        env:
          PORCUPINE_TEST_POSTGRES_CACHE: ${{ runner.temp }}/porcupine-test-postgres
  sdk-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: compat/package-lock.json
      - run: npm ci --prefix compat
      - run: cd compat && npx playwright install --with-deps chromium
      - run: PORCUPINE_OIDC_BROWSER=1 go test -race ./internal/porcupine -run "^(TestInteractiveOIDC|TestEmail)" -count=1
      - run: make compat
      - run: npm ci --prefix compat/segment
      - run: npm test --prefix compat/segment
      - run: npm --prefix compat run test:identify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sdk-compat
          path: compat/artifacts/
          if-no-files-found: error
