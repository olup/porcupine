services:
  porcupine:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORCUPINE_BOOTSTRAP_TOKEN: ${PORCUPINE_BOOTSTRAP_TOKEN:?Set a private bootstrap token}
      PORCUPINE_TRUSTED_PROXIES: ${PORCUPINE_TRUSTED_PROXIES:-}
      PORCUPINE_ALLOWED_ORIGINS: ${PORCUPINE_ALLOWED_ORIGINS:-}
      PORCUPINE_HOT_RECEIPT_LIMIT: ${PORCUPINE_HOT_RECEIPT_LIMIT:-0}
      PORCUPINE_QUEUE_MAX_EVENTS: ${PORCUPINE_QUEUE_MAX_EVENTS:-100000}
      PORCUPINE_QUEUE_MAX_BYTES: ${PORCUPINE_QUEUE_MAX_BYTES:-268435456}
      PORCUPINE_PIPELINE_KEY: ${PORCUPINE_PIPELINE_KEY:-}
      PORCUPINE_PIPELINE_KEY_FILE: ${PORCUPINE_PIPELINE_KEY_FILE:-}
      PORCUPINE_PIPELINE_S3_ENDPOINTS: ${PORCUPINE_PIPELINE_S3_ENDPOINTS:-}
      PORCUPINE_EXPORT_MAX_EXECUTION_SECONDS: ${PORCUPINE_EXPORT_MAX_EXECUTION_SECONDS:-86400}
      PORCUPINE_EXPORT_MAX_READ_BYTES: ${PORCUPINE_EXPORT_MAX_READ_BYTES:-1099511627776}
      PORCUPINE_EXPORT_MAX_OUTPUT_BYTES: ${PORCUPINE_EXPORT_MAX_OUTPUT_BYTES:-1099511627776}
      PORCUPINE_EXPORT_FILE_BYTES: ${PORCUPINE_EXPORT_FILE_BYTES:-268435456}
      PORCUPINE_EXPORT_MAX_ROW_BYTES: ${PORCUPINE_EXPORT_MAX_ROW_BYTES:-8388608}
      PORCUPINE_EXPORT_MEMORY_BYTES: ${PORCUPINE_EXPORT_MEMORY_BYTES:-536870912}
      PORCUPINE_EXPORT_BANDWIDTH_BYTES_PER_SECOND: ${PORCUPINE_EXPORT_BANDWIDTH_BYTES_PER_SECOND:-5242880}
      PORCUPINE_EXPORT_TEMPORARY_BYTES: ${PORCUPINE_EXPORT_TEMPORARY_BYTES:-1073741824}
      PORCUPINE_EXPORT_QUEUE_THRESHOLD: ${PORCUPINE_EXPORT_QUEUE_THRESHOLD:-1000}
      PORCUPINE_EXPORT_MAX_QUEUED_JOBS: ${PORCUPINE_EXPORT_MAX_QUEUED_JOBS:-100}
      PORCUPINE_EXPORT_RETENTION_HOURS: ${PORCUPINE_EXPORT_RETENTION_HOURS:-168}
      PORCUPINE_CLICKHOUSE_URL: http://clickhouse:8123
      PORCUPINE_CLICKHOUSE_DATABASE: porcupine
      PORCUPINE_CLICKHOUSE_USER: porcupine_admin
      PORCUPINE_CLICKHOUSE_PASSWORD: ${PORCUPINE_CLICKHOUSE_PASSWORD:?Set a private ClickHouse provisioning password}
    depends_on:
      - clickhouse
    volumes:
      - porcupine-data:/data
    stop_grace_period: 30s
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: porcupine_admin
      CLICKHOUSE_PASSWORD: ${PORCUPINE_CLICKHOUSE_PASSWORD:?Set a private ClickHouse provisioning password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    mem_limit: 2g
    stop_grace_period: 30s
volumes:
  porcupine-data:
  clickhouse-data:
