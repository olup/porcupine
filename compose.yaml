# One server configuration for local files, email, S3, backups and shared control.
# Build:     docker compose build porcupine
# First run: docker compose --profile setup run --rm init
# Then:     docker compose up -d porcupine
x-server: &server
  build: .
  image: ${PORCUPINE_IMAGE:-porcupine:dev}
  volumes:
    - porcupine-data:/data

services:
  porcupine:
    <<: *server
    command: ["--config", "/data/porcupine.json"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 2g
    stop_grace_period: 30s

  init:
    <<: *server
    profiles: [setup]
    command: ["init", "--docker", "--config", "/data/porcupine.json"]

  config-check:
    <<: *server
    profiles: [tools]
    command: ["config", "check", "--config", "/data/porcupine.json"]

  postgres:
    image: postgres:17-bookworm
    profiles: [shared]
    restart: unless-stopped
    environment:
      POSTGRES_USER: porcupine
      POSTGRES_DB: porcupine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porcupine -d porcupine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  porcupine-data:
  postgres-data:
